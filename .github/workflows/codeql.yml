name: CodeQL + Docker CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    # Use ubuntu-latest for the analysis job
    # Define permissions for the job
    # Define language to be analyzed
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  docker:
    name: Docker Build & Run
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t go-web-server .

      - name: Run container
        run: docker run -d --name app -p 8080:8080 go-web-server

      - name: Test /readfile
        run: |
          for i in {1..10}; do
            if curl -f "http://localhost:8080/readfile?file=safe-files/hello.txt"; then
              exit 0
            fi
            echo "Server not ready yet, retrying ($i/10)..."
            sleep 2
          done
          echo "Server did not respond. Container state and logs:"
          docker ps -a
          docker logs app
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f app
    # Define steps to build and run the Docker container
